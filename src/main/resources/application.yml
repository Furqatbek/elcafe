# ===== BRANDING CONFIGURATION =====
# Change these values to rebrand the entire platform
branding:
  name: ${BRAND_NAME:Qahvoon}
  short-name: ${BRAND_SHORT_NAME:Qahvoon}
  tagline: ${BRAND_TAGLINE:Restaurant Delivery}
  description: ${BRAND_DESCRIPTION:Restaurant Delivery Control Service}
  domain: ${BRAND_DOMAIN:qahvoon.uz}
  api-url: ${BRAND_API_URL:https://www.qahvoon.uz}
  support-email: ${BRAND_SUPPORT_EMAIL:support@qahvoon.uz}
  team-name: ${BRAND_TEAM_NAME:Qahvoon Team}

spring:
  application:
    name: restaurant-delivery-service

  lifecycle:
    # Grace window for graceful shutdown to drain in-flight work before the JVM exits.
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elcafe_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Warn if a connection is held longer than this (ms) — surfaces leaks and open-in-view stalls.
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        default_schema: public
        enable_lazy_load_no_trans: true
        # Batch lazy proxy/collection loads into IN(...) queries instead of one-per-parent (N+1), and
        # batch inserts/updates. Pure performance — no behavior change; complements the still-open
        # open-in-view (turning that off is a separate, load-tested change).
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: true

  flyway:
    enabled: true
    # false: never silently baseline a non-empty schema at v1 (which would skip/misapply migrations).
    # This app is Flyway-managed from V1, so a fresh DB applies the whole chain without baselining, and
    # an existing DB already has flyway_schema_history — so this is safe and closes the mis-baseline trap.
    baseline-on-migrate: false
    locations: classpath:db/migration
    schemas: public
    # true: verify the checksum/order of applied migrations on every startup, so a migration file edited
    # after it was applied is caught instead of drifting silently. NOTE: if the prod schema already drifted
    # while this was false, the first deploy after this change will fail with a checksum error — audit the
    # difference, then run `flyway repair` to realign the history before redeploying.
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Tashkent

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: ${SERVER_PORT:8080}
  # Drain in-flight requests on SIGTERM instead of dropping them (paired with the exec-form Docker
  # entrypoint so the JVM actually receives the signal as PID 1).
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # prometheus = the metrics scrape endpoint (observability). It is NOT in the SecurityConfig
        # permitAll list, so /actuator/prometheus requires authentication — scrape it from an authenticated
        # context or move actuator to a separate internal management port in prod.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.elcafe: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
  file:
    name: ${LOG_FILE_PATH:/app/logs/elcafe.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
  pattern:
    # [%X{requestId}] is the per-request correlation id (RequestIdFilter); empty on background/scheduled
    # threads. Lets you grep every log line for one request.
    console: '%d{yyyy-MM-dd HH:mm:ss} [%X{requestId:-}] - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

app:
  security:
    jwt:
      # SECURITY: no default — JWT_SECRET MUST be provided via env (>= 32 bytes). The app refuses to
      # start otherwise (JwtUtil#validateSecret). Rotating the secret invalidates all existing tokens.
      secret: ${JWT_SECRET:}
      # Finite, env-tunable lifetimes (ms). Access tokens are short-lived; clients must obtain a new
      # one via POST /api/v1/auth/refresh when they get a 401. Bump these via env if a client cannot
      # yet refresh, but do not return to the old "never expires" values.
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}        # 15 minutes
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:2592000000}  # 30 days
      waiter-token-expiration: ${JWT_WAITER_TOKEN_EXPIRATION_MS:43200000}      # 12 hours (a shift)
    cors:
      allowed-origins: ${CORS_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: '*'
      allow-credentials: true
    login:
      # Per-account brute-force lockout (LoginAttemptService): after N failed logins within the window,
      # the account is locked for lock-minutes. Complements the per-IP @RateLimited(AUTH) on the endpoint.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      attempt-window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
    tenant-enforcement:
      # Cross-tenant access control mode (Phase 0 §3.3):
      #   off     - filter disabled (no-op)
      #   shadow  - LOG any request whose URL/query restaurantId != the caller's tenant, but
      #             do NOT block. Use this to observe real traffic before enforcing.
      #   enforce - additionally return 403 on a cross-tenant mismatch.
      # Flipped to enforce after the shadow soak + the Phase 0 hardening (V148-V155, IDOR sweep,
      # backstop filter, insert guard) landed and were verified. Rollback: set the env var to shadow.
      mode: ${TENANT_ENFORCEMENT_MODE:enforce}

  subscription:
    enforcement:
      # Phase 2 access gate. A suspended tenant (Restaurant.active=false, set via the platform console)
      # gets 402 SUBSCRIPTION_INACTIVE on staff requests. Ships off; flip to shadow to watch the
      # [subscription-shadow] logs, then enforce. Expired-not-suspended plans stay in read-only mode.
      #   off | shadow | enforce
      mode: ${SUBSCRIPTION_ENFORCEMENT_MODE:off}

  websocket:
    auth:
      # STOMP CONNECT authentication + per-subscription tenant check (audit #21). The admin/waiter web
      # app sends its Bearer token on CONNECT; the print agent now sends its AGENT_TOKEN (minted via
      # POST /api/v1/settings/print-agent/token). Now ENFORCE. Rollback: set the env var to shadow.
      #   off | shadow | enforce
      mode: ${WEBSOCKET_AUTH_MODE:enforce}

  cache:
    menu-ttl: 1800 # 30 minutes
    restaurant-ttl: 3600 # 1 hour

  courier:
    # No default — the courier webhook fails CLOSED (rejects all callbacks) until COURIER_WEBHOOK_SECRET
    # is set. Callers must send it as the X-Webhook-Secret header.
    webhook-secret: ${COURIER_WEBHOOK_SECRET:}

  # Password-reset email. SMTP is configured via the standard spring.mail.* env vars (SPRING_MAIL_HOST,
  # ...); if unset, JavaMailSender is absent and the reset flow logs a warning instead of sending (see
  # EmailService). reset-password-url is the front-end reset page; the token is appended as ?token=.
  mail:
    from: ${MAIL_FROM:no-reply@${branding.domain}}
    reset-password-url: ${MAIL_RESET_PASSWORD_URL:}

  consumer:
    otp:
      expiration-minutes: 5 # OTP validity duration
      max-attempts: 3 # Maximum verification attempts
      rate-limit-minutes: 1 # Rate limit time window
      rate-limit-count: 3 # Maximum OTP requests within time window
      include-in-response: ${CONSUMER_OTP_INCLUDE_IN_RESPONSE:false} # Include OTP in response (dev/test only)
      development-mode: ${CONSUMER_OTP_DEVELOPMENT_MODE:true} # Accept any OTP in dev mode (no SMS sending)
    session:
      # Finite, env-tunable consumer session lifetimes (ms). A stolen consumer token must not be valid
      # forever; clients refresh the access token via the consumer refresh flow. Do NOT restore the old
      # "10000 years" values.
      access-token-expiration: ${CONSUMER_ACCESS_TOKEN_EXPIRATION_MS:3600000}      # 1 hour
      refresh-token-expiration: ${CONSUMER_REFRESH_TOKEN_EXPIRATION_MS:2592000000} # 30 days

  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_BASE_URL:http://localhost:8080/uploads}
    max-file-size: 10MB
    max-request-size: 10MB

  selfservice:
    base-url: ${SELFSERVICE_BASE_URL:http://localhost:5173/order}

  printing:
    # Set to true to use print agent queue (for cloud deployments)
    # Set to false for direct printing (backend on same network as printers)
    use-agent: ${PRINTING_USE_AGENT:true}

# Eskiz.uz SMS Broker Configuration
eskiz:
  sms:
    base-url: ${ESKIZ_SMS_BASE_URL:https://notify.eskiz.uz/api}
    email: ${ESKIZ_SMS_EMAIL:}
    password: ${ESKIZ_SMS_PASSWORD:}
    enabled: ${ESKIZ_SMS_ENABLED:true}
    connection-timeout: 30000
    read-timeout: 30000
    token-expiration-ms: 2505600000 # 29 days
    callback-url: ${ESKIZ_SMS_CALLBACK_URL:}

# Web Push Notifications Configuration
push:
  vapid:
    # Generate VAPID keys using: npx web-push generate-vapid-keys
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:mailto:${branding.support-email}}

# Self-Service / QR Code Ordering Configuration
# Note: selfservice config is under main 'app:' section above

# Telegram Bot Configuration
telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
  owner-bot:
    enabled: ${TELEGRAM_OWNER_BOT_ENABLED:true}
    token: ${TELEGRAM_OWNER_BOT_TOKEN:}
    username: ${TELEGRAM_OWNER_BOT_USERNAME:}
  # Proxy settings — required when api.telegram.org is blocked (e.g. in Uzbekistan)
  # Set TELEGRAM_PROXY_ENABLED=true and configure a SOCKS5 or HTTP proxy
  proxy:
    enabled: ${TELEGRAM_PROXY_ENABLED:false}
    type: ${TELEGRAM_PROXY_TYPE:SOCKS5}   # SOCKS5, SOCKS4, or HTTP
    host: ${TELEGRAM_PROXY_HOST:}
    port: ${TELEGRAM_PROXY_PORT:1080}

# Stock Alert Configuration
stock-alert:
  enabled: ${STOCK_ALERT_ENABLED:true}
  check-interval-minutes: ${STOCK_ALERT_CHECK_INTERVAL:30}
  alert-cooldown-hours: ${STOCK_ALERT_COOLDOWN:4}

# Financial Alert Configuration (Daily Reports via Telegram)
financial-alert:
  enabled: ${FINANCIAL_ALERT_ENABLED:true}
  check-interval-minutes: ${FINANCIAL_ALERT_CHECK_INTERVAL:15}
  default-report-time: ${FINANCIAL_ALERT_DEFAULT_TIME:23:00}
