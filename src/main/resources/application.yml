# ===== BRANDING CONFIGURATION =====
# Change these values to rebrand the entire platform
branding:
  name: ${BRAND_NAME:El Cafe}
  short-name: ${BRAND_SHORT_NAME:ElCafe}
  tagline: ${BRAND_TAGLINE:Restaurant Delivery}
  description: ${BRAND_DESCRIPTION:Restaurant Delivery Control Service}
  domain: ${BRAND_DOMAIN:elcafe.com}
  api-url: ${BRAND_API_URL:https://api.elcafe.com}
  support-email: ${BRAND_SUPPORT_EMAIL:support@elcafe.com}
  team-name: ${BRAND_TEAM_NAME:ElCafe Team}

spring:
  application:
    name: restaurant-delivery-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elcafe_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        default_schema: public
        enable_lazy_load_no_trans: true
    open-in-view: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Tashkent

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.elcafe: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
  file:
    name: ${LOG_FILE_PATH:/app/logs/elcafe.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:f54a0f3634b3fb7083d03dfe8f54d090a18be3517a0560bab3eb7c192c56edd1}
      access-token-expiration: 315360000000000 # 10000 years (effectively no expiration)
      refresh-token-expiration: 315360000000000 # 10000 years (effectively no expiration)
      waiter-token-expiration: 315360000000000 # 10000 years (effectively no expiration)
    cors:
      allowed-origins: ${CORS_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: '*'
      allow-credentials: true

  cache:
    menu-ttl: 1800 # 30 minutes
    restaurant-ttl: 3600 # 1 hour

  courier:
    webhook-secret: ${COURIER_WEBHOOK_SECRET:change-me-in-production}

  consumer:
    otp:
      expiration-minutes: 5 # OTP validity duration
      max-attempts: 3 # Maximum verification attempts
      rate-limit-minutes: 1 # Rate limit time window
      rate-limit-count: 3 # Maximum OTP requests within time window
      include-in-response: ${CONSUMER_OTP_INCLUDE_IN_RESPONSE:false} # Include OTP in response (dev/test only)
      development-mode: ${CONSUMER_OTP_DEVELOPMENT_MODE:true} # Accept any OTP in dev mode (no SMS sending)
    session:
      access-token-expiration: 315360000000000 # 10000 years (effectively no expiration)
      refresh-token-expiration: 315360000000000 # 10000 years (effectively no expiration)

  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_BASE_URL:http://localhost:8080/uploads}
    max-file-size: 10MB
    max-request-size: 10MB

  selfservice:
    base-url: ${SELFSERVICE_BASE_URL:http://localhost:5173/order}

  printing:
    # Set to true to use print agent queue (for cloud deployments)
    # Set to false for direct printing (backend on same network as printers)
    use-agent: ${PRINTING_USE_AGENT:true}

# Eskiz.uz SMS Broker Configuration
eskiz:
  sms:
    base-url: ${ESKIZ_SMS_BASE_URL:https://notify.eskiz.uz/api}
    email: ${ESKIZ_SMS_EMAIL:}
    password: ${ESKIZ_SMS_PASSWORD:}
    enabled: ${ESKIZ_SMS_ENABLED:true}
    connection-timeout: 30000
    read-timeout: 30000
    token-expiration-ms: 2505600000 # 29 days
    callback-url: ${ESKIZ_SMS_CALLBACK_URL:}

# Web Push Notifications Configuration
push:
  vapid:
    # Generate VAPID keys using: npx web-push generate-vapid-keys
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:mailto:${branding.support-email}}

# Self-Service / QR Code Ordering Configuration
# Note: selfservice config is under main 'app:' section above

# Telegram Bot Configuration
telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
  owner-bot:
    enabled: ${TELEGRAM_OWNER_BOT_ENABLED:true}
    token: ${TELEGRAM_OWNER_BOT_TOKEN:}
    username: ${TELEGRAM_OWNER_BOT_USERNAME:}
  # Proxy settings — required when api.telegram.org is blocked (e.g. in Uzbekistan)
  # Set TELEGRAM_PROXY_ENABLED=true and configure a SOCKS5 or HTTP proxy
  proxy:
    enabled: ${TELEGRAM_PROXY_ENABLED:false}
    type: ${TELEGRAM_PROXY_TYPE:SOCKS5}   # SOCKS5, SOCKS4, or HTTP
    host: ${TELEGRAM_PROXY_HOST:}
    port: ${TELEGRAM_PROXY_PORT:1080}

# Stock Alert Configuration
stock-alert:
  enabled: ${STOCK_ALERT_ENABLED:true}
  check-interval-minutes: ${STOCK_ALERT_CHECK_INTERVAL:30}
  alert-cooldown-hours: ${STOCK_ALERT_COOLDOWN:4}

# Financial Alert Configuration (Daily Reports via Telegram)
financial-alert:
  enabled: ${FINANCIAL_ALERT_ENABLED:true}
  check-interval-minutes: ${FINANCIAL_ALERT_CHECK_INTERVAL:15}
  default-report-time: ${FINANCIAL_ALERT_DEFAULT_TIME:23:00}
