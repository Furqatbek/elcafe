spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        globally_quoted_identifiers: false
    open-in-view: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Tashkent

app:
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hs256
      access-token-expiration: 3600000
      refresh-token-expiration: 7200000
      waiter-token-expiration: 3600000
      waiter-refresh-token-expiration: 7200000
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: false

  file:
    upload-dir: /tmp/test-uploads
    base-url: http://localhost:8080/uploads

branding:
  name: ElCafe Test
  short-name: ElCafe
  domain: test.elcafe.com
  support-email: test@elcafe.com
  team-name: ElCafe Test Team

eskiz:
  sms:
    enabled: false

push:
  vapid:
    public-key: test-public-key
    private-key: test-private-key
    subject: mailto:test@elcafe.com

telegram:
  bot:
    enabled: false
  owner-bot:
    enabled: false
  proxy:
    enabled: false

stock-alert:
  enabled: false

financial-alert:
  enabled: false

logging:
  level:
    root: WARN
    com.elcafe: INFO
