services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: elcafe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elcafe}
      POSTGRES_USER: ${DB_USER:-elcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.docker.example)}
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    volumes:
      # Host bind mount, not a named volume — survives down -v,
      # volume prune, and project-name changes since Docker can't
      # remove host paths it doesn't manage. Data lives in
      # ./data/postgres in the repo root (gitignored).
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Loopback-only: reachable for local admin on the host, NOT exposed to the network.
      - "127.0.0.1:5432:5432"
    networks:
      - elcafe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elcafe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily Postgres backup sidecar. Writes pg_dump output to
  # ./backups on the host (bind mount, gitignored). Rotates
  # automatically: keeps 7 dailies, 4 weeklies, 6 monthlies. The
  # image runs its own internal cron — no host-cron setup needed.
  # To restore: see DOCKER_DEPLOYMENT.md or run
  #   gunzip -c ./backups/daily/<file>.sql.gz | docker exec -i elcafe-db psql -U elcafe -d elcafe
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: elcafe-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-elcafe}
      POSTGRES_USER: ${DB_USER:-elcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.docker.example)}
      POSTGRES_EXTRA_OPTS: "-Z6 --quote-all-identifiers"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
    networks:
      - elcafe-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: elcafe-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
      # Required — compose refuses to start without it, so Redis is never unauthenticated.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.docker.example)}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      # Loopback-only: not exposed to the network.
      - "127.0.0.1:6379:6379"
    networks:
      - elcafe-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elcafe-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Tashkent
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-elcafe}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-elcafe}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.docker.example)}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.docker.example)}
      # No insecure fallback. If unset the app fails closed at boot (§3.5 validateSecret), so prod
      # must supply a real JWT_SECRET (.env / environment; generate: openssl rand -hex 32). Local
      # dev gets a dev-only default from docker-compose.local.yml, so the local override needs no
      # setup. The app also rejects a too-short or old-leaked secret.
      JWT_SECRET: "${JWT_SECRET:-}"
      # No wildcard default. In the prod profile a blank/`*` origin with credentials is rejected at
      # startup (ProductionConfigValidator); set CORS_ORIGINS to an explicit comma-separated origin list.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # First-boot platform operator (docs/LAUNCH.md): when the users table is empty and both are
      # set, the app creates a SUPER_ADMIN account. Inert afterwards — remove ADMIN_PASSWORD from
      # the environment once you have logged in and changed the password.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Courier delivery-status callbacks authenticate with this shared secret (X-Webhook-Secret).
      # The endpoint fails closed (rejects all callbacks) while unset.
      COURIER_WEBHOOK_SECRET: ${COURIER_WEBHOOK_SECRET:-}
      # Password-reset email (optional). Without SPRING_MAIL_HOST the mail sender is not configured
      # and forgot-password logs a warning instead of sending.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_RESET_PASSWORD_URL: ${MAIL_RESET_PASSWORD_URL:-}
      # MUST stay false in production (dev mode accepts ANY OTP). The prod profile also forces this.
      CONSUMER_OTP_DEVELOPMENT_MODE: ${CONSUMER_OTP_DEVELOPMENT_MODE:-false}
      # Tenant isolation mode: off | shadow | enforce (Phase 0 §3.3/§3.4). Now ENFORCE — isolation is
      # active after the Phase 0 hardening + shadow soak (see docs/TENANT_ENFORCE_FLIP_RUNBOOK.md).
      # Rollback is a one-liner: set this to shadow.
      TENANT_ENFORCEMENT_MODE: ${TENANT_ENFORCEMENT_MODE:-enforce}
      # Phase 2 subscription access gate: off | shadow | enforce. Defaults to off (dark). A suspended
      # tenant's staff/waiters get 402 SUBSCRIPTION_INACTIVE only in 'enforce'. Flip off -> shadow
      # (watch [subscription-shadow] logs) -> enforce, same cadence as TENANT_ENFORCEMENT_MODE.
      SUBSCRIPTION_ENFORCEMENT_MODE: ${SUBSCRIPTION_ENFORCEMENT_MODE:-off}
      # STOMP WebSocket auth: off | shadow | enforce (audit #21). Now ENFORCE — CONNECT requires a
      # Bearer token and a session may only read its own tenant's topics. The print agent must send its
      # AGENT_TOKEN (POST /api/v1/settings/print-agent/token). Rollback: set to shadow.
      WEBSOCKET_AUTH_MODE: ${WEBSOCKET_AUTH_MODE:-enforce}
      # QR Code URL - used for generating QR code links
      SELFSERVICE_BASE_URL: ${SELFSERVICE_BASE_URL:-https://qahvoon.uz/order}
      FILE_BASE_URL: ${FILE_BASE_URL:-https://qahvoon.uz/uploads}
      # Console log format: json = one JSON object per line for log aggregation; unset/plain = the
      # human-readable default (see logback-spring.xml). The rolling file (in the `logs` volume)
      # stays plain either way.
      LOG_FORMAT: ${LOG_FORMAT:-}
      # Error tracking (Sentry, audit F4). DORMANT unless a DSN is set — with it, unhandled server
      # errors are reported with stack trace + requestId/tenantId context.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Order-completion event chain (FUNC-15): loyalty accrual + completion SMS. OFF by default —
      # setting this to true starts granting customer bonuses (product decision).
      ORDER_COMPLETED_EVENTS_ENABLED: ${ORDER_COMPLETED_EVENTS_ENABLED:-false}
    ports:
      # Loopback-only. nginx reaches the app over the compose network (upstream backend -> backend:8080),
      # so the app must NOT be published on the network — that would let clients bypass nginx (and forge
      # X-Real-IP to defeat the per-IP auth rate limit). Kept on 127.0.0.1 for host-local debugging.
      - "127.0.0.1:8080:8080"
    networks:
      - elcafe-network
    volumes:
      - uploads:/app/uploads
      # Named volume, NOT a ./logs host bind mount: the app runs as non-root (uid 1000) and a
      # first-time bind mount is created owned by root, so the container can't open its log file
      # ("logs/elcafe.log Permission denied") — on a clean Linux deploy and on Docker Desktop alike.
      # A named volume is initialised from the image's /app/logs (chowned to uid 1000 in the
      # Dockerfile), so it is writable. Read logs with `docker compose logs -f backend` (the console
      # stream is the primary channel); the rolling file + heap dumps live in this volume, retrievable
      # via `docker compose cp backend:/app/logs ./logs` if needed.
      - logs:/app/logs
    healthcheck:
      # Liveness, not the aggregate /actuator/health: a Redis/SMTP dependency blip must degrade the
      # health report, not restart-loop the app container (audit F4). Readiness lives at
      # /actuator/health/readiness for anything that needs the dependency view.
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Dashboard (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        # EH-4.4: optional frontend error tracking. Empty = dormant (SDK never loaded).
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    container_name: elcafe-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
    networks:
      - elcafe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main Reverse Proxy (NGINX)
  nginx-proxy:
    image: nginx:alpine
    container_name: elcafe-nginx-proxy
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - elcafe-network
    volumes:
      - ${NGINX_CONF:-./nginx-proxy/nginx-local.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  elcafe-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
