version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: elcafe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elcafe}
      POSTGRES_USER: ${DB_USER:-elcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elcafe_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - elcafe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elcafe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elcafe-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-elcafe}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-elcafe}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-elcafe_secret}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://lacasa.uz,https://www.lacasa.uz}
    ports:
      - "8080:8080"
    networks:
      - elcafe-network
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend NGINX + React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: elcafe-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - elcafe-network
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Optional: for SSL certificates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  elcafe-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
