services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: elcafe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elcafe}
      POSTGRES_USER: ${DB_USER:-elcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elcafe_secret}
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    volumes:
      # Host bind mount, not a named volume — survives down -v,
      # volume prune, and project-name changes since Docker can't
      # remove host paths it doesn't manage. Data lives in
      # ./data/postgres in the repo root (gitignored).
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - elcafe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elcafe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily Postgres backup sidecar. Writes pg_dump output to
  # ./backups on the host (bind mount, gitignored). Rotates
  # automatically: keeps 7 dailies, 4 weeklies, 6 monthlies. The
  # image runs its own internal cron — no host-cron setup needed.
  # To restore: see DOCKER_DEPLOYMENT.md or run
  #   gunzip -c ./backups/daily/<file>.sql.gz | docker exec -i elcafe-db psql -U elcafe -d elcafe
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: elcafe-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-elcafe}
      POSTGRES_USER: ${DB_USER:-elcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elcafe_secret}
      POSTGRES_EXTRA_OPTS: "-Z6 --quote-all-identifiers"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
    networks:
      - elcafe-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: elcafe-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    ports:
      - "6379:6379"
    networks:
      - elcafe-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elcafe-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Tashkent
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-elcafe}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-elcafe}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-elcafe_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # No insecure fallback: refuse to start unless a real secret is provided (§3.5). The app also
      # rejects a too-short/old-default secret at boot. Generate: openssl rand -hex 32.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set; generate one with openssl rand -hex 32}"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Tenant isolation mode: off | shadow | enforce (Phase 0 §3.3/§3.4). Defaults to shadow
      # (observe + log, no blocking); set to 'enforce' to activate isolation after a staging soak —
      # see docs/TENANT_ENFORCE_FLIP_RUNBOOK.md.
      TENANT_ENFORCEMENT_MODE: ${TENANT_ENFORCEMENT_MODE:-shadow}
      # QR Code URL - used for generating QR code links
      SELFSERVICE_BASE_URL: ${SELFSERVICE_BASE_URL:-https://qahvoon.uz/order}
      FILE_BASE_URL: ${FILE_BASE_URL:-https://qahvoon.uz/uploads}
    ports:
      - "8080:8080"
    networks:
      - elcafe-network
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Dashboard (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: elcafe-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
    networks:
      - elcafe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Customer Website (React)
  # website-frontend:
  #   build:
  #     context: ./template-smith-forge
  #     dockerfile: Dockerfile
  #     args:
  #       VITE_API_BASE_URL: /api/v1
  #       VITE_RESTAURANT_ID: ${VITE_RESTAURANT_ID:-1}
  #   container_name: elcafe-website-frontend
  #   restart: unless-stopped
  #   environment:
  #     TZ: Asia/Tashkent
  #   depends_on:
  #     - backend
  #   networks:
  #     - elcafe-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Main Reverse Proxy (NGINX)
  nginx-proxy:
    image: nginx:alpine
    container_name: elcafe-nginx-proxy
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - elcafe-network
    volumes:
      - ${NGINX_CONF:-./nginx-proxy/nginx-local.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  elcafe-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  uploads:
    driver: local
