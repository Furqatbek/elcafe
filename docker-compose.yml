services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: megahotdog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-megahotdog}
      POSTGRES_USER: ${DB_USER:-megahotdog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-megahotdog_secret}
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - megahotdog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-megahotdog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: megahotdog-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    ports:
      - "6379:6379"
    networks:
      - megahotdog-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: megahotdog-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Tashkent
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-megahotdog}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-megahotdog}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-megahotdog_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # QR Code URL - used for generating QR code links
      SELFSERVICE_BASE_URL: ${SELFSERVICE_BASE_URL:-https://demo.restos.uz/order}
      FILE_BASE_URL: ${FILE_BASE_URL:-https://demo.restos.uz/uploads}
    ports:
      - "8080:8080"
    networks:
      - megahotdog-network
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Dashboard (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: megahotdog-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
    networks:
      - megahotdog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Customer Website (React)
  website-frontend:
    build:
      context: ./template-smith-forge
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_RESTAURANT_ID: ${VITE_RESTAURANT_ID:-1}
    container_name: megahotdog-website-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
    networks:
      - megahotdog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main Reverse Proxy (NGINX)
  nginx-proxy:
    image: nginx:alpine
    container_name: megahotdog-nginx-proxy
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
    depends_on:
      - backend
      - frontend
      - website-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - megahotdog-network
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  megahotdog-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
