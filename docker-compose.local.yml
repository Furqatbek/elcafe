# Local development overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Dev-only signing secret so this override boots with zero setup. NEVER use in production —
      # prod runs without this file and must supply a real JWT_SECRET. Set JWT_SECRET in your shell
      # or .env to override it locally.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-not-for-production-0123456789abcdef}
      # Local QR code URL - override production default
      SELFSERVICE_BASE_URL: http://localhost/order
      FILE_BASE_URL: http://localhost/uploads

  nginx-proxy:
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
