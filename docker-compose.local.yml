# Local development overrides.
#
# Easiest: ./run-local.sh  (supplies throwaway dev DB/Redis passwords, then runs the command below).
#
# Manual: DB_PASSWORD and REDIS_PASSWORD are required by the base compose (the `:?` guards), so pass
# them — they aren't set here because compose interpolates those from the shell/.env at parse time,
# not from a service's environment block:
#   DB_PASSWORD=dev REDIS_PASSWORD=dev docker compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Dev-only signing secret so the backend boots without a real JWT_SECRET. NEVER use in
      # production — prod runs without this file and must supply a real JWT_SECRET. Set JWT_SECRET
      # in your shell or .env to override it locally.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-not-for-production-0123456789abcdef}
      # Local QR code URL - override production default
      SELFSERVICE_BASE_URL: http://localhost/order
      FILE_BASE_URL: http://localhost/uploads
      # Local-dev convenience ONLY: keep the Hibernate session open through response rendering so
      # lazy associations load on demand (Spring's default). Production runs without this file and
      # the CI test profile sets open-in-view=false, so genuine lazy-loading bugs still surface in
      # tests — this just stops local browsing from tripping over them while they're being fixed.
      SPRING_JPA_OPEN_IN_VIEW: "true"

  # Don't publish the datastore ports on the host in local dev — they collide with a locally
  # installed PostgreSQL/Redis. On Windows that surfaces as a bind failure ("An attempt was made to
  # access a socket in a way forbidden by its access permissions" on 5432). The app reaches db/redis
  # over the compose network, and you reach the app through nginx on http://localhost, so these
  # host publishes are pure debugging convenience and safe to drop locally.
  # (The !reset tag needs Docker Compose 2.24+; any recent Docker Desktop has it.)
  db:
    ports: !reset []
    # Named volume instead of the base's ./data/postgres host bind mount. Postgres only applies
    # POSTGRES_PASSWORD when its data dir is EMPTY, so a stale ./data/postgres left by an earlier run
    # (a different password) causes "password authentication failed for user elcafe". A fresh named
    # volume initialises cleanly with the current DB_PASSWORD, and `docker compose ... down -v` resets
    # it — matching the always-empty-DB dev workflow. (Prod keeps the ./data/postgres bind mount.)
    volumes:
      - pgdata_local:/var/lib/postgresql/data
  redis:
    ports: !reset []

  nginx-proxy:
    # !override (NOT !reset) so local publishes exactly 80: it REPLACES the base list [80, 443] with
    # this one. !reset would empty the list and ignore the replacement, leaving port 80 unpublished
    # so the app is unreachable on the host. The base's 443 is dropped because local nginx is
    # HTTP-only.
    ports: !override
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  # Local Postgres data lives here (see the db override above), so it's isolated from prod's
  # ./data/postgres and disposable via `docker compose ... down -v`.
  pgdata_local:
    driver: local
