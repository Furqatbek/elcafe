# Local development overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Allow any origin in local dev (mobile web on localhost:5173, a LAN IP,
      # emulator, etc.). Overrides whatever CORS_ORIGINS is in .env — typically
      # the production domains copied from .env.example — so local requests
      # aren't rejected with "Invalid CORS request". The backend reflects the
      # origin per-request, so "*" stays compatible with allow-credentials.
      CORS_ORIGINS: "*"
      # Never poll Telegram from local dev. A restored production database
      # carries active bot tokens in owner_telegram_bot_config /
      # telegram_bot_config; without these flags the local backend would poll
      # the same tokens as prod and both get "409 Conflict: terminated by
      # other getUpdates request". These hard-disable both bots regardless of
      # DB content. Flip to "true" (with your OWN test-bot token) to test bots.
      TELEGRAM_OWNER_BOT_ENABLED: "false"
      TELEGRAM_BOT_ENABLED: "false"
      # Local QR code URL - override production default
      SELFSERVICE_BASE_URL: http://localhost/order
      FILE_BASE_URL: http://localhost/uploads

  nginx-proxy:
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
