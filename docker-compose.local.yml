# Local development overrides.
#
# Easiest: ./run-local.sh  (supplies throwaway dev DB/Redis passwords, then runs the command below).
#
# Manual: DB_PASSWORD and REDIS_PASSWORD are required by the base compose (the `:?` guards), so pass
# them — they aren't set here because compose interpolates those from the shell/.env at parse time,
# not from a service's environment block:
#   DB_PASSWORD=dev REDIS_PASSWORD=dev docker compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Dev-only signing secret so the backend boots without a real JWT_SECRET. NEVER use in
      # production — prod runs without this file and must supply a real JWT_SECRET. Set JWT_SECRET
      # in your shell or .env to override it locally.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-not-for-production-0123456789abcdef}
      # Local QR code URL - override production default
      SELFSERVICE_BASE_URL: http://localhost/order
      FILE_BASE_URL: http://localhost/uploads

  nginx-proxy:
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
