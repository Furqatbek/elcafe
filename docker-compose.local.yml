# Local development overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  nginx-proxy:
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
